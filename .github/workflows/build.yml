name: Build index.html

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html from src/
        run: node build.js

      - name: Commit and push if index.html changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html is already up to date."
          else
            git commit -m "chore: rebuild index.html from src"
            git push
          fi
